# Deploys AI Every Time on Render (render.com): one Docker web service, with a disk that keeps its database between
# deploys. In Render's dashboard choose New > Blueprint and pick this repository. It asks for the values marked
# "sync: false": they're kept in Render, never in this file. See ai-every-time/README.md, "Deploy it".
services:
  - type: web
    name: ai-every-time
    runtime: docker
    rootDir: ai-every-time                       # only changes to the app start a new deploy
    dockerfilePath: ./ai-every-time/Dockerfile   # relative to the repository's root
    dockerContext: ./ai-every-time
    region: frankfurt                            # can't be changed later
    plan: 0.5c-512mb                             # disks need a paid instance; choose a bigger one as learners grow
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: PORT
        value: "8000"
      - key: AIET_SECURE_COOKIES
        value: "1"
      - key: AIET_PUBLIC_URL        # the site's address, e.g. https://www.aieverytime.org (or the onrender.com one at first)
        sync: false
      - key: AIET_ADMIN_EMAILS      # your email address: sign up with it to see the Staff pages
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: AIET_SMTP_HOST         # e.g. smtp.gmail.com
        sync: false
      - key: AIET_SMTP_USER
        sync: false
      - key: AIET_SMTP_PASSWORD     # for Gmail, an app password
        sync: false
      - key: AIET_MAIL_FROM         # e.g. AI Every Time <hello@aieverytime.org>
        sync: false
