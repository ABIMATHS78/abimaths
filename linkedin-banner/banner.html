<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LinkedIn Banner</title>
<!--
  LinkedIn personal profile background photo: exactly 1584 × 396 px (4:1).
  Open in a browser to preview; run `node render.js` to export the PNG.
  Add ?guides=1 to the URL to see where the profile photo and the mobile crop fall.

  Fonts: Inter Display, Inter and JetBrains Mono (all free, Google Fonts).
-->
<style>
  html, body { margin: 0; padding: 0; background: #091320; }
  svg { display: block; }
  .display { font-family: 'Inter Display', 'Inter', system-ui, sans-serif; }
  .body    { font-family: 'Inter', system-ui, sans-serif; }
  .mono    { font-family: 'JetBrains Mono', ui-monospace, monospace; }
</style>
</head>
<body>
<svg id="banner" xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <defs>
    <radialGradient id="bg" cx="1060" cy="170" r="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#132843"/>
      <stop offset="1" stop-color="#091320"/>
    </radialGradient>
    <!-- graph-paper dot grid: 48 × 12 cells -->
    <pattern id="dots" width="33" height="33" patternUnits="userSpaceOnUse">
      <circle cx="16.5" cy="16.5" r="1.2" fill="#2B4466"/>
    </pattern>
    <!-- noise (cool slate) resolving into signal (warm gold) -->
    <linearGradient id="signal" x1="0" y1="0" x2="790" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#4E6A8E" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#6F86A6" stop-opacity="0.8"/>
      <stop offset="0.72" stop-color="#F2B544"/>
      <stop offset="1"    stop-color="#F7BE4F"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0"    stop-color="#F7BE4F" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#F7BE4F" stop-opacity="0.12"/>
      <stop offset="1"    stop-color="#F7BE4F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1584" height="396" fill="url(#bg)"/>
  <rect width="1584" height="396" fill="url(#dots)" opacity="0.5"/>
  <g id="scatter"></g>
  <g id="chart"></g>
  <g id="labels"></g>

  <!-- Copy. Everything here sits inside x 600–1390, y 48–348: clear of the
       profile photo (bottom-left) and of the edges phones trim. -->
  <g id="copy">
    <text id="headline" x="883" y="166" class="display" font-size="86" font-weight="600" letter-spacing="-1.8" fill="#F4F7FB">Data Leader<tspan fill="#F7BE4F">.</tspan></text>
    <text id="role" x="885" y="224" class="display" font-size="41" font-weight="400" fill="#C7D3E2">Experienced Data Analyst</text>
    <rect id="rule" x="888" y="252" width="56" height="3" rx="1.5" fill="#F7BE4F"/>
    <text id="tagline" x="886" y="298" class="body" font-size="23" font-weight="400" fill="#8EA3BE">From noise to signal. From data to decisions.</text>
  </g>

  <g id="guides"></g>
</svg>

<script>
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  };

  // The "noise" is real data: z-scores (clipped at ±2.2) of the Na_to_K column
  // in drug200.csv (Decision Trees project), in file order.
  const NA_TO_K = [1.29,-0.42,-0.83,-1.15,0.27,-1.04,0.03,-0.7,-0.13,0.46,-0.6,0.43,-0.1,0.67,-0.47,-0.08,-0.64,-0.29,-1.22,1.37,0.42,1.36,2.01,-0.15,2.2,0.38,1.98,-0.93,0.92,0.26,-1.02,-0.9,-0.7,2.19,-0.27,-1.22,-0.92,-0.3,-0.88,-0.97,0.44,-0.26,-0.04,-0.53,-0.53,-1.11,-0.42,-0.8,2.17,0.52,0.46,-0.72,1.54,0.33,-0.82,-0.27,-0.66,1.63,-0.83,0.36,1.91,-0.92,0.64,-1.07,-0.39,1.52,-0.45,-0.73,1.19,1.14,-0.29,0.5,-0.76,0.95,0.14,0.67,-0.68,0.43,-0.38,-0.73,-0.3,-1.16,-0.88,-0.66,-0.84,-0.3,-0.35,-0.08,0.97,0.16,0.07,-0.13,1.85,1.83,-0.15,-0.65,2.2,1.29,2.2,0.09,-0.58,-0.45,-0.41,-0.99,1.69,-0.99,-0.57,0.55,-0.89,0.11,-1.19,-1.3,-0.96,-0.32,-0.94,0.31,-0.91,-0.83,-0.8,1.3];
  // Scatter offsets: z-scores of the Age column from the same file.
  const AGE = [-1.29,0.16,0.16,-0.99,1.01,-1.35,0.28,-0.2,0.95,-0.08,0.16,-0.63,-0.08,1.8,0.34,-1.72,1.5,-0.08,-1.29,-0.75,0.77,1.13,0.16,0.22,-0.69,-0.99,-0.81,0.28,-0.32,0.04,-1.59,1.8,0.28,1.25,0.53,0.1,-0.75,-0.32,-0.32,-1.78,1.74,0.83,0.34,-1.29,0.34,1.31,-0.44,1.44,-1.29,-0.99,0.83,1.37,1.07,-1.23,1.44,-1.11,1.25,-0.26,0.95,-0.63,-0.38,-1.23,1.37,0.04,0.95,1.44,-0.93,-1.66,0.59,-1.59,1.56,-0.99,-1.23,-0.2,-0.81,-1.11,-0.5,-1.11,-1.53,-0.75,0.95,1.19,-0.75,-0.38,0.16,0.89,0.41,1.5,-0.44,0.34];

  // Seeded PRNG so the scatter's x positions are identical on every render.
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = mulberry32(7);

  // Trend: flat, then an S-curve rising into the "impact" point beside the headline.
  const E = { x: 778, y: 136 };
  const yLow = 262, xm = 600, s = 62;
  const logistic = x => 1 / (1 + Math.exp(-(x - xm) / s));
  const L0 = logistic(-20), L1 = logistic(E.x);
  const trend = x => yLow - (yLow - E.y) * (logistic(x) - L0) / (L1 - L0);
  const smoothstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const amp = x => 26 * (1 - smoothstep(330, 590, x));   // noise fades out before DATA

  // The line: noisy readings that settle into the clean trend.
  const pts = [];
  let n = 0, i = 0;
  for (let x = -20; x < E.x; x += 7, i++) {
    n = 0.35 * n + 0.65 * NA_TO_K[i % NA_TO_K.length];
    pts.push([x, trend(x) - amp(x) * n]);
  }
  pts.push([E.x, E.y]);
  el('polyline', {
    points: pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '),
    fill: 'none', stroke: 'url(#signal)', 'stroke-width': 3,
    'stroke-linejoin': 'round', 'stroke-linecap': 'round'
  }, document.getElementById('chart'));
  const lineY = x => {
    for (let k = 1; k < pts.length; k++) if (pts[k][0] >= x) {
      const [x0, y0] = pts[k - 1], [x1, y1] = pts[k];
      return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
    }
    return E.y;
  };

  // Raw observations scattered around the noisy stretch.
  const scatter = document.getElementById('scatter');
  AGE.forEach(a => {
    const x = -10 + Math.pow(rnd(), 1.2) * 570;
    const spread = 10 + 62 * (1 - smoothstep(200, 600, x));
    const y = trend(x) + a * spread * 0.62;
    const r = 1.5 + rnd() * 1.8, op = 0.12 + rnd() * 0.3;
    if (y < 30 || y > 376) return;
    el('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: r.toFixed(2), fill: '#7090B8', 'fill-opacity': op.toFixed(2) }, scatter);
  });

  // Annotations: DATA -> INSIGHT -> IMPACT
  const labels = document.getElementById('labels');
  const label = (x, y, text, color) => {
    const t = el('text', { x, y, 'text-anchor': 'middle', class: 'mono', 'font-size': 18, 'font-weight': 500, 'letter-spacing': 3, fill: color }, labels);
    t.textContent = text;
  };
  for (const [x, text] of [[602, 'DATA'], [690, 'INSIGHT']]) {
    const y = lineY(x);
    el('circle', { cx: x, cy: y.toFixed(1), r: 5.5, fill: '#0E1D31', stroke: '#F2B544', 'stroke-width': 2 }, labels);
    label(x + 1.5, y - 24, text, '#8197B4');
  }
  const chart = document.getElementById('chart');
  el('circle', { cx: E.x, cy: E.y, r: 34, fill: 'url(#glow)' }, chart);
  el('circle', { cx: E.x, cy: E.y, r: 16, fill: 'none', stroke: '#F7BE4F', 'stroke-opacity': 0.5, 'stroke-width': 1.5 }, chart);
  el('circle', { cx: E.x, cy: E.y, r: 7, fill: '#F7BE4F' }, chart);
  label(E.x + 1.5, E.y - 40, 'IMPACT', '#F7BE4F');

  // ?guides=1 — layout check only, never exported.
  if (new URLSearchParams(location.search).get('guides') === '1') {
    const g = document.getElementById('guides');
    // Desktop: profile photo measured at x 56–360, top y 212 (banner shown at 792 × 198).
    el('circle', { cx: 208, cy: 364, r: 152, fill: '#ff3b6b', 'fill-opacity': 0.35, stroke: '#ff3b6b', 'stroke-width': 2 }, g);
    // Mobile: bottom-left 568 × 264 can be covered; ~192 px can be trimmed from each side.
    el('rect', { x: 0, y: 132, width: 568, height: 264, fill: 'none', stroke: '#33d1ff', 'stroke-width': 2, 'stroke-dasharray': '8 6' }, g);
    el('rect', { x: 192, y: 48, width: 1200, height: 300, fill: 'none', stroke: '#7CFC8A', 'stroke-width': 2, 'stroke-dasharray': '4 4' }, g);
  }

  document.fonts.ready.then(() => { window.__ready = true; });
</script>
</body>
</html>
