<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Banner Preview</title>
<!-- Approximate LinkedIn profile layouts, to check the banner against the
     profile photo. Run `node render.js` to export linkedin-banner-preview.png. -->
<style>
  :root { --page: #F4F2EE; --card: #FFFFFF; --ink: #1D2226; --muted: #666666; --bar: #E3E6EA; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); font-family: 'Inter', system-ui, sans-serif; color: var(--ink); }
  .wrap { width: 1300px; padding: 36px 40px 40px; display: flex; gap: 38px; align-items: flex-start; }
  .label { font: 600 13px/1 'Inter', sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px 2px; }
  .card { background: var(--card); border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.06); position: relative; }
  .banner { display: block; width: 100%; aspect-ratio: 4 / 1; }
  .photo { position: absolute; border-radius: 50%; border: 4px solid #fff; background: #DCE1E8; overflow: hidden; }
  .photo svg { width: 100%; height: 100%; display: block; }
  .body { padding: 0 24px 24px; }
  .name { font: 600 24px/1.25 'Inter', sans-serif; margin: 0 0 10px; }
  .bar { height: 12px; border-radius: 6px; background: var(--bar); margin-top: 9px; }
  /* Desktop: banner shown at 792 × 198; photo measured at banner x 56–360, top y 212. */
  .desktop { width: 792px; }
  .desktop .photo { width: 152px; height: 152px; left: 28px; top: 106px; }
  .desktop .body { padding-top: 76px; }
  /* Phone: 390 pt wide, photo on the left overlapping the banner's bottom edge. */
  .mobile { width: 390px; border-radius: 28px; }
  .mobile .photo { width: 104px; height: 104px; left: 16px; top: 45.5px; }
  .mobile .body { padding: 62px 16px 26px; }
  .mobile .name { font-size: 20px; }
  .note { font-size: 13px; color: var(--muted); margin: 14px 0 0 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <p class="label">Desktop</p>
    <div class="card desktop">
      <img class="banner" src="linkedin-banner-1584x396.png" alt="">
      <div class="photo"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="40" r="18" fill="#A9B4C2"/><ellipse cx="50" cy="94" rx="34" ry="28" fill="#A9B4C2"/></svg></div>
      <div class="body">
        <p class="name">Mojeed Abisiga</p>
        <div class="bar" style="width: 62%"></div>
        <div class="bar" style="width: 38%"></div>
      </div>
    </div>
    <p class="note">Approximate layouts; LinkedIn varies slightly by device and screen size.</p>
  </div>
  <div>
    <p class="label">Mobile app</p>
    <div class="card mobile">
      <img class="banner" src="linkedin-banner-1584x396.png" alt="">
      <div class="photo"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="40" r="18" fill="#A9B4C2"/><ellipse cx="50" cy="94" rx="34" ry="28" fill="#A9B4C2"/></svg></div>
      <div class="body">
        <p class="name">Mojeed Abisiga</p>
        <div class="bar" style="width: 78%"></div>
        <div class="bar" style="width: 46%"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
