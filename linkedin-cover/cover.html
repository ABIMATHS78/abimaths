<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data Leader Cover</title>
<meta name="viewport" content="width=1584">
<!--
  LinkedIn personal-profile cover, 1584 x 396 px (LinkedIn's recommended 4:1 size).
  Consulting-exhibit style: bright background, a few deep-navy elements, one
  electric-blue highlight, a Bodoni serif headline. The chart is a waterfall, Data + Insight + Decision
  = Impact, the kind of exhibit a strategy consultancy would draw.

  Fonts load from Google Fonts (Bodoni Moda, Inter), so rendering needs internet.
  Render to PNG with:  node linkedin-cover/render.cjs
  Open with ?debug to see the profile-photo and phone-crop safe zones.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #F3F6F9; }
  body { width: 1584px; height: 396px; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="cover" xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396"></svg>
<script>
(async () => {
  const q = new URLSearchParams(location.search);

  // ---- Editable content -------------------------------------------------
  const HEADLINE = 'Data Leader';
  const SUBTITLE = 'Experienced Data Analyst';
  const TAGLINE  = 'Turning data into decisions that drive impact.';
  // Waterfall steps (relative sizes, not real figures). The last bar is the total.
  const STEPS = [
    { label: 'Data',     value: 34 },
    { label: 'Insight',  value: 26 },
    { label: 'Decision', value: 30 },
    { label: 'Impact',   total: true },
  ];

  // ---- Palette ------------------------------------------------------------
  const C = {
    surface:  '#F3F6F9',  // bright, cool off-white
    navy:     '#051C2C',  // deep navy: the few darks
    accent:   '#2251FF',  // electric blue: the one highlight
    step:     '#8FA3BF',  // increments (steel blue)
    ink2:     '#33475B',  // secondary text
    ink3:     '#5E6B78',  // muted text, chart labels
    hairline: '#B4BFCB',  // connectors
    axis:     '#8C99A6',  // baseline
  };

  // ---- Geometry -----------------------------------------------------------
  const W = 1584, H = 396;
  const TEXT_X = 480;
  const HEAD_Y = 160, SUB_Y = 214, RULE_Y = 240, TAG_Y = 279;
  const BASE_Y = 279;                 // chart baseline, level with the tagline
  const BAR_W = 44, PITCH = 80, CHART_X = 1070;
  const IMPACT_TOP = 98;              // tallest bar tops out at the headline's cap height

  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('cover');
  const el = (tag, attrs = {}, parent = svg) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    parent.appendChild(n);
    return n;
  };

  const SERIF = "'Bodoni Moda', 'Bodoni 72', Didot, serif";
  const SANS  = "'Inter', 'Helvetica Neue', Arial, sans-serif";
  const headFont = "500 88px 'Bodoni Moda'";
  const subFont  = "400 30px 'Inter'";
  const tagFont  = "400 19px 'Inter'";
  const lblFont  = "500 16px 'Inter'";
  await Promise.all([headFont, subFont, tagFont, lblFont, "600 16px 'Inter'"].map(f => document.fonts.load(f, HEADLINE + SUBTITLE + TAGLINE)));
  await document.fonts.ready;

  // Shift each line so its first glyph's ink (not its advance box) sits on x.
  const ctx = document.createElement('canvas').getContext('2d');
  const inkLeft = (font, ch) => { ctx.font = font; return -ctx.measureText(ch).actualBoundingBoxLeft; };
  const textAt = (x, y, font, str, attrs) => {
    const t = el('text', { x: (x - inkLeft(font, str[0])).toFixed(2), y, ...attrs });
    t.textContent = str;
    return t;
  };

  // ---- Background ---------------------------------------------------------
  el('rect', { x: 0, y: 0, width: W, height: H, fill: C.surface });

  // ---- Text ---------------------------------------------------------------
  textAt(TEXT_X, HEAD_Y, headFont, HEADLINE, {
    'font-family': SERIF, 'font-weight': 500, 'font-size': 88, fill: C.navy, 'letter-spacing': -0.5,
    style: "font-optical-sizing: none; font-variation-settings: 'opsz' 20",
  });
  textAt(TEXT_X, SUB_Y, subFont, SUBTITLE, {
    'font-family': SANS, 'font-weight': 400, 'font-size': 30, fill: C.ink2,
  });
  el('rect', { x: TEXT_X, y: RULE_Y, width: 56, height: 3, fill: C.accent });
  textAt(TEXT_X, TAG_Y, tagFont, TAGLINE, {
    'font-family': SANS, 'font-weight': 400, 'font-size': 19, fill: C.ink3,
  });

  // ---- Waterfall ----------------------------------------------------------
  const total = STEPS.filter(s => !s.total).reduce((a, s) => a + s.value, 0);
  const scale = (BASE_Y - IMPACT_TOP) / total;
  // Square at the baseline, softly rounded (2px) at the data end.
  const bar = (x, yTop, yBottom, fill) => {
    const r = 2, w = BAR_W;
    el('path', {
      d: `M${x} ${yBottom} V${yTop + r} Q${x} ${yTop} ${x + r} ${yTop} H${x + w - r} Q${x + w} ${yTop} ${x + w} ${yTop + r} V${yBottom} Z`,
      fill,
    });
  };
  let running = 0;
  STEPS.forEach((s, i) => {
    const x = CHART_X + i * PITCH;
    let yTop, yBottom, fill;
    if (s.total) {
      yTop = BASE_Y - total * scale; yBottom = BASE_Y; fill = C.accent;
    } else {
      yBottom = BASE_Y - running * scale;
      running += s.value;
      yTop = BASE_Y - running * scale;
      fill = i === 0 ? C.navy : C.step;
    }
    bar(x, yTop, yBottom, fill);
    // Connector from this bar's top to the next bar.
    if (i < STEPS.length - 1) {
      el('line', {
        x1: x + BAR_W, x2: x + PITCH, y1: yTop + 0.5, y2: yTop + 0.5,
        stroke: C.hairline, 'stroke-width': 1,
      });
    }
    const last = i === STEPS.length - 1;
    const lbl = el('text', {
      x: x + BAR_W / 2, y: BASE_Y + 27, 'text-anchor': 'middle',
      'font-family': SANS, 'font-weight': last ? 600 : 500, 'font-size': 16,
      fill: last ? C.navy : C.ink3,
    });
    lbl.textContent = s.label;
  });
  el('line', {
    x1: CHART_X - 14, x2: CHART_X + (STEPS.length - 1) * PITCH + BAR_W + 14,
    y1: BASE_Y + 0.5, y2: BASE_Y + 0.5, stroke: C.axis, 'stroke-width': 1,
  });

  // ---- Debug overlay: where LinkedIn covers / trims the banner ------------
  if (q.has('debug')) {
    const g = el('g', { fill: 'none', 'stroke-width': 2 });
    // Desktop profile photo (approx.): 152px circle + 4px border at 804px display width.
    el('circle', { cx: 47 + 158, cy: 200 + 158, r: 158, stroke: '#FF4D6D', 'stroke-dasharray': '6 5' }, g);
    // Phone profile photo (approx.): ~100px circle on a 390px-wide banner.
    el('circle', { cx: 65 + 203, cy: 211 + 203, r: 203, stroke: '#FF9F1C', 'stroke-dasharray': '3 4' }, g);
    // Possible phone crops: centre 80% (dotted) and, at the extreme, centre 60% (dashed).
    el('line', { x1: 158, x2: 158, y1: 0, y2: H, stroke: '#7B61FF', 'stroke-dasharray': '2 4' }, g);
    el('line', { x1: 1426, x2: 1426, y1: 0, y2: H, stroke: '#7B61FF', 'stroke-dasharray': '2 4' }, g);
    el('line', { x1: 317, x2: 317, y1: 0, y2: H, stroke: '#2EC4B6', 'stroke-dasharray': '8 6' }, g);
    el('line', { x1: 1267, x2: 1267, y1: 0, y2: H, stroke: '#2EC4B6', 'stroke-dasharray': '8 6' }, g);
  }

  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
