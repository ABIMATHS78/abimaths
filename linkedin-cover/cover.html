<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data Leader Cover</title>
<meta name="viewport" content="width=1584">
<!--
  LinkedIn personal-profile cover, 1584 x 396 px (LinkedIn's recommended 4:1 size).
  Concept: noise -> signal -> decision. Scattered data points narrow into one
  clean trend line that ends in a single amber decision point; the same dots
  reappear on the right, put in order as a small column chart.

  Fonts (all free): Inter Display, Inter, JetBrains Mono. Install them locally
  before rendering, or the browser falls back to a generic sans / mono.
  Render to PNG with:  node linkedin-cover/render.mjs
  Open with ?debug to see the profile-photo and phone-crop safe zones.
-->
<style>
  html, body { margin: 0; padding: 0; background: #0C1626; }
  body { width: 1584px; height: 396px; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="cover" xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396"></svg>
<script>
(async () => {
  // ---- Editable content -------------------------------------------------
  const HEADLINE = 'Data Leader';
  const SUBTITLE = 'Experienced Data Analyst';
  const PIPELINE = ['NOISE', 'SIGNAL', 'DECISION', 'IMPACT'];

  // ---- Palette ------------------------------------------------------------
  const C = {
    surface: '#0C1626',   // deep navy
    ink1:    '#F4F6FA',   // primary text
    ink2:    '#B6C1D0',   // secondary text
    ink3:    '#7E8BA0',   // muted text
    ink4:    '#4F5B6F',   // separators
    data:    '#8A9AB3',   // data points (slate)
    accent:  '#F5B83D',   // the single highlight: the decision
  };

  // ---- Geometry -----------------------------------------------------------
  const W = 1584, H = 396;
  const TEXT_X = 668;                 // left edge of the text block (ink edge)
  const DP = { x: 600, y: 140 };      // the decision point
  const Y0 = 314;                     // where the trend starts at x = 0

  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('cover');
  const el = (tag, attrs = {}, parent = svg) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    parent.appendChild(n);
    return n;
  };

  // Seeded PRNG so every render is identical.
  const mulberry32 = a => () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const rand = mulberry32(20261103);
  const gauss = () => {
    let u = 0, v = 0;
    while (u === 0) u = rand();
    while (v === 0) v = rand();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };

  const clamp01 = t => Math.max(0, Math.min(1, t));
  const tOf = x => clamp01(x / DP.x);
  const trend = x => Y0 + (DP.y - Y0) * Math.pow(tOf(x), 1.4);   // the signal
  const spread = x => 70 * Math.pow(1 - tOf(x), 1.25) + 1.5;      // the noise, shrinking

  await document.fonts.ready;

  // ---- Defs ---------------------------------------------------------------
  const defs = el('defs');
  const glow = el('radialGradient', { id: 'glow', cx: DP.x, cy: DP.y, r: 190, gradientUnits: 'userSpaceOnUse' }, defs);
  el('stop', { offset: 0,    'stop-color': C.accent, 'stop-opacity': 0.08 }, glow);
  el('stop', { offset: 0.45, 'stop-color': C.accent, 'stop-opacity': 0.018 }, glow);
  el('stop', { offset: 1,    'stop-color': C.accent, 'stop-opacity': 0 }, glow);

  const lineFade = el('linearGradient', { id: 'lineFade', x1: 0, y1: 0, x2: DP.x, y2: 0, gradientUnits: 'userSpaceOnUse' }, defs);
  [[0, 0], [0.3, 0.06], [0.62, 0.45], [0.86, 0.85], [1, 0.95]].forEach(([o, a]) =>
    el('stop', { offset: o, 'stop-color': C.ink1, 'stop-opacity': a }, lineFade));

  // Gridlines recede behind the text block.
  const gridFade = el('linearGradient', { id: 'gridFade', x1: 0, y1: 0, x2: W, y2: 0, gradientUnits: 'userSpaceOnUse' }, defs);
  [[0, 1], [0.37, 1], [0.44, 0.15], [0.79, 0.15], [0.83, 1], [1, 1]].forEach(([o, a]) =>
    el('stop', { offset: o, 'stop-color': '#FFFFFF', 'stop-opacity': a * 0.05 }, gridFade));

  // ---- Background ---------------------------------------------------------
  el('rect', { x: 0, y: 0, width: W, height: H, fill: C.surface });
  el('rect', { x: 0, y: 0, width: W, height: H, fill: 'url(#glow)' });
  for (let y = 66; y < H; y += 66) {
    el('line', { x1: 0, x2: W, y1: y + 0.5, y2: y + 0.5, stroke: 'url(#gridFade)', 'stroke-width': 1 });
  }

  // ---- Uncertainty fan (1, 2, 3 sigma), narrowing as the signal emerges ---
  [[3, 0.016], [2, 0.022], [1, 0.03]].forEach(([k, a]) => {
    const band = [];
    for (let x = -30; x <= DP.x; x += 6) band.push([x, trend(x) - k * spread(x)]);
    for (let x = DP.x; x >= -30; x -= 6) band.push([x, trend(x) + k * spread(x)]);
    el('path', {
      d: 'M' + band.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join(' L') + ' Z',
      fill: C.data, 'fill-opacity': a,
    });
  });

  // ---- Data points: noise on the left, tightening into the signal ---------
  const pts = [];
  const MIN_D = 10.5;
  for (let tries = 0; pts.length < 250 && tries < 40000; tries++) {
    const x = -24 + rand() * (DP.x - 14 + 24);
    const s = spread(x);
    const y = trend(x) + gauss() * s;
    if (y < 12 || y > H + 6) continue;
    if (Math.hypot(x - DP.x, y - DP.y) < 38) continue;
    if (pts.some(p => (p.x - x) ** 2 + (p.y - y) ** 2 < MIN_D * MIN_D)) continue;
    pts.push({ x, y, z: Math.abs(y - trend(x)) / s, t: tOf(x) });
  }
  for (const p of pts) {
    const close = Math.exp(-0.5 * p.z * p.z);            // 1 = sits on the signal
    const r = 2.1 + 1.3 * close * (0.45 + 0.55 * p.t);
    const op = 0.2 + 0.5 * close * (0.35 + 0.65 * p.t) + 0.15 * p.t;
    el('circle', { cx: p.x.toFixed(1), cy: p.y.toFixed(1), r: r.toFixed(2), fill: C.data, 'fill-opacity': op.toFixed(3) });
  }

  // ---- The signal ---------------------------------------------------------
  const line = [];
  for (let x = 0; x <= DP.x - 11; x += 3) line.push([x, trend(x)]);
  el('path', {
    d: 'M' + line.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(2)}`).join(' L'),
    fill: 'none', stroke: 'url(#lineFade)', 'stroke-width': 2,
    'stroke-linecap': 'round', 'stroke-linejoin': 'round',
  });

  // ---- The decision -------------------------------------------------------
  el('circle', { cx: DP.x, cy: DP.y, r: 28, fill: 'none', stroke: C.accent, 'stroke-opacity': 0.16, 'stroke-width': 1.25 });
  el('circle', { cx: DP.x, cy: DP.y, r: 17, fill: 'none', stroke: C.accent, 'stroke-opacity': 0.42, 'stroke-width': 1.5 });
  el('circle', { cx: DP.x, cy: DP.y, r: 9, fill: C.surface });     // 2px surface ring
  el('circle', { cx: DP.x, cy: DP.y, r: 7, fill: C.accent });

  // ---- Text ---------------------------------------------------------------
  // Shift each line so its first glyph's ink (not its advance box) sits on TEXT_X.
  const ctx = document.createElement('canvas').getContext('2d');
  const inkLeft = (font, text) => { ctx.font = font; return -ctx.measureText(text).actualBoundingBoxLeft; };

  const headFont = "600 92px 'Inter Display'";
  const head = el('text', {
    x: TEXT_X - inkLeft(headFont, HEADLINE[0]), y: 172,
    'font-family': "'Inter Display', 'Inter', sans-serif", 'font-weight': 600, 'font-size': 92,
    fill: C.ink1,
  });
  head.textContent = HEADLINE;
  // Amber full stop: the same mark as the decision point, tying title to chart.
  ctx.font = headFont;
  const headRight = Number(head.getAttribute('x')) + ctx.measureText(HEADLINE).width;
  el('circle', { cx: (headRight + 13).toFixed(1), cy: 172 - 7, r: 7, fill: C.accent });

  const subFont = "400 34px 'Inter'";
  const sub = el('text', {
    x: TEXT_X - inkLeft(subFont, SUBTITLE[0]), y: 229,
    'font-family': "'Inter', sans-serif", 'font-weight': 400, 'font-size': 34,
    fill: C.ink2,
  });
  sub.textContent = SUBTITLE;

  const pipeFont = "500 19px 'JetBrains Mono'";
  const pipe = el('text', {
    x: TEXT_X - inkLeft(pipeFont, PIPELINE[0][0]), y: 290,
    'font-family': "'JetBrains Mono', monospace", 'font-weight': 500, 'font-size': 19,
    'letter-spacing': 2.6,
  });
  // Each step a little brighter than the last: a crescendo ending on IMPACT.
  const tones = [C.ink3, '#9AA6B8', C.ink2, C.ink1];
  PIPELINE.forEach((word, i) => {
    if (i > 0) el('tspan', { fill: C.ink4 }, pipe).textContent = ' → ';
    el('tspan', { fill: tones[i] }, pipe).textContent = word;
  });

  // ---- Impact: the same dots, put in order as a rising column chart -------
  const COLS = [2, 3, 3, 5, 6, 8];
  const CX0 = 1338, PX = 30, PY = 22, BASE = 284;
  COLS.forEach((n, i) => {
    const last = i === COLS.length - 1;
    for (let j = 0; j < n; j++) {
      el('circle', { cx: CX0 + i * PX, cy: BASE - j * PY, r: 3.6, fill: C.data, 'fill-opacity': last ? 0.95 : 0.42 });
    }
  });
  el('line', {
    x1: CX0 - 16, x2: CX0 + (COLS.length - 1) * PX + 16, y1: BASE + 14.5, y2: BASE + 14.5,
    stroke: '#FFFFFF', 'stroke-opacity': 0.14, 'stroke-width': 1,
  });

  // ---- Debug overlay: where LinkedIn covers / trims the banner ------------
  if (new URLSearchParams(location.search).has('debug')) {
    const g = el('g', { fill: 'none', 'stroke-width': 2 });
    // Desktop profile photo (approx.): 152px circle + 4px border at 804px display width.
    el('circle', { cx: 47 + 158, cy: 200 + 158, r: 158, stroke: '#FF4D6D', 'stroke-dasharray': '6 5' }, g);
    // Conservative "keep text out" corner quoted by several guides.
    el('rect', { x: 1, y: 132, width: 567, height: 263, stroke: '#FF9F1C', 'stroke-dasharray': '3 4' }, g);
    // Possible phone crop: only the centre 60% of the width visible.
    el('line', { x1: 317, x2: 317, y1: 0, y2: H, stroke: '#2EC4B6', 'stroke-dasharray': '8 6' }, g);
    el('line', { x1: 1267, x2: 1267, y1: 0, y2: H, stroke: '#2EC4B6', 'stroke-dasharray': '8 6' }, g);
  }

  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
