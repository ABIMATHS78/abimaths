# The library: prompts and templates readers can copy. Each item: title, category, text (markup allowed),
# and any of prompt (shown in a box with a Copy button), download (a file in content/media/ or a web address)
# and read (issue:<slug> or guide:<slug>, with read_label).
title = "Prompts & templates"
intro = "Copy them, change them to fit how you work, and use them today."

[[items]]
title = "SKILL.md template"
category = "Skills"
text = "The start of every skill: a name and a description between two lines of dashes, then your instructions."
prompt_label = "SKILL.md"
prompt = """---
name: weekly-report
description: Turns the week's notes and numbers into our team's weekly report format. Use when someone asks for the weekly report or pastes weekly updates.
---

## Steps
1. ...

## Mistakes to avoid
- ...

## Example
...
"""
read = "issue:make-your-first-skill"
read_label = "How to fill it in"

[[items]]
title = "Draft a skill with Claude"
category = "Skills"
text = "Let Claude interview you about the job, then write the file."
prompt = "Help me turn the way I write our weekly report into a skill. Ask me questions first, then write the SKILL.md."

[[items]]
title = "Make sure Claude uses your skill"
category = "Skills"
text = "Name the skill in your request when you need to be sure."
prompt = "Use my weekly-report skill on these notes."
read = "guide:claude-skills-from-zero"

[[items]]
title = "Rewrite a skill's description"
category = "Skills"
text = "Claude chooses a skill from its description alone. Paste your SKILL.md under this prompt."
prompt = """Here is my skill's SKILL.md. Rewrite its description so it says what the skill does and when to use it, in the third person, in 200 characters or fewer, with no tags in angle brackets. Then give me three requests that should use the skill and two that shouldn't.

[paste your SKILL.md here]"""
read = "issue:skill-description"
read_label = "Why it matters"

[[items]]
title = "Review a skill before you install it"
category = "Safety"
text = "Paste the skill's files under it, with the skill switched off."
prompt = """I'm about to install this Claude skill. Read every file below and tell me, in plain English:
1. What the skill does.
2. Whether any instruction asks for something unrelated to that job, or hides what it's doing.
3. Whether any script downloads software, sends information to a website, or reads files it wasn't given.
4. Whether there are passwords, API keys or personal data anywhere.
Quote the exact lines you're worried about.

[paste the files here]"""
read = "issue:check-a-skill-before-you-trust-it"
read_label = "The five-minute check"

[[items]]
title = "Five-request test plan"
category = "Skills"
text = "Three requests that should use the skill, two that shouldn't. Fix the description first if Claude misses one."
prompt = """Should use it:
1. ...
2. ...
3. ...

Shouldn't use it:
4. ...
5. ..."""

[[items]]
title = "Make Claude describe your data first"
category = "Data"
text = "Upload the file, then paste this before your real question. Check the row count and dates in the answer."
prompt = """Before answering anything, describe this file:
1. How many rows and columns, and what each column contains.
2. The date range.
3. Missing values, numbers stored as text, and repeated rows.
4. Anything that looks like a totals row or a second table.
Don't analyse anything yet."""
read = "guide:ask-claude-about-your-data"
read_label = "The full method"

[[items]]
title = "Show the working"
category = "Data"
text = "Add it to any question about numbers, so you can check the answer."
prompt = "Show your working: list each step, the number of rows after each step, and the formula you used. Then give the answer."
read = "guide:ask-claude-about-your-data"

[[items]]
title = "Learn anything, step by step"
category = "Learning"
text = "Say what you already know, so the explanation starts in the right place."
prompt = "Teach me how neural networks learn. I know basic algebra."

[[items]]
title = "Practice questions from your notes"
category = "Learning"
prompt = "Quiz me on these lecture notes. Ten questions, mixed."

[[items]]
title = "Plan a talk before the slides"
category = "Work"
prompt = "Plan a ten-minute talk on our quarterly results for the board."

[[items]]
title = "Meeting notes into actions"
category = "Work"
prompt = "Here's the transcript of today's team call."
text = "Paste the transcript under it. Ask for decisions, actions with owners and deadlines, and a follow-up email."

[[faq]]
q = "Are these free?"
a = "Yes. Copy them, change them, use them at work."

[[faq]]
q = "Where do I learn how skills work?"
a = "Start with [Claude skills, from zero](guide:claude-skills-from-zero)."
