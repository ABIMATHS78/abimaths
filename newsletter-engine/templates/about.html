{% extends "base.html" %}
{% from "_macros.html" import subscribe_box %}
{% block main %}
<div class="container">
  <header class="page-head"><p class="eyebrow">About</p><h1>{{ about_title }}</h1></header>
  <div class="about-grid">
    <img src="{{ link(site.author.avatar) }}" alt="{{ site.author.name }}" width="220" height="220">
    <div class="prose" style="padding-top:0">
      {{ about_html | safe }}
      {{ subscribe_box() }}
    </div>
  </div>
</div>
{% endblock %}
